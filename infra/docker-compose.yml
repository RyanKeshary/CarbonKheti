version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: carbonkheti-db
    environment:
      POSTGRES_DB: carbonkheti
      POSTGRES_USER: carbonkheti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonkheti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carbonkheti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: carbonkheti-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://carbonkheti:${POSTGRES_PASSWORD:-postgres_dev_password}@db:5432/carbonkheti
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:-}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:-}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  site:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: carbonkheti-site
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
